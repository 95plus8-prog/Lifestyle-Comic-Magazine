<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>生活影像集 | Apple Glass 模板</title>
    <meta
      name="description"
      content="一个浅色、优雅、玻璃质感的个人生活影像主页模板。"
    />
    <link rel="stylesheet" href="apple-template.css?v=1" />
  </head>
  <body>
    <header class="glass-header" aria-label="主导航">
      <a class="brand-lockup" href="#top" aria-label="返回首页">
        <span>Life Frames</span>
        <strong>生活影像集</strong>
      </a>
      <nav class="nav-pills" aria-label="页面导航">
        <a href="#works">作品</a>
        <a href="#series">系列</a>
        <a href="#about">关于</a>
      </nav>
    </header>

    <main id="top">
      <section class="hero-section" aria-labelledby="hero-title">
        <div class="hero-copy glass-panel">
          <p class="eyebrow">Personal Visual Journal</p>
          <h1 id="hero-title">把生活的片刻，整理成一本轻盈的影像集。</h1>
          <p>
            旅行、城市、美食与运动，被收进柔和的光影和清透的玻璃层次里。
          </p>
          <div class="hero-actions">
            <a class="primary-action" href="#works">浏览作品</a>
            <a class="secondary-action" href="#series">查看系列</a>
          </div>
        </div>

        <div class="hero-gallery" aria-label="精选作品预览">
          <figure class="feature-card feature-card-large">
            <img src="assets/photos/旅途/巴黎铁塔旅拍.png" alt="旅途精选作品" />
          </figure>
          <figure class="feature-card feature-card-top">
            <img src="assets/photos/美食/双人火锅餐桌.png" alt="美食精选作品" />
          </figure>
          <figure class="feature-card feature-card-bottom">
            <img src="assets/photos/运动/团队完赛庆祝.png" alt="运动精选作品" />
          </figure>
        </div>
      </section>

      <section class="stats-strip" aria-label="影像摘要">
        <div class="stat-card glass-panel">
          <span id="total-count">00</span>
          <strong>张作品</strong>
        </div>
        <div class="stat-card glass-panel">
          <span>07</span>
          <strong>个系列</strong>
        </div>
        <div class="stat-card glass-panel">
          <span>2026</span>
          <strong>生活记录</strong>
        </div>
      </section>

      <section class="works-section" id="works" aria-labelledby="works-title">
        <div class="section-heading">
          <p>Selected Works</p>
          <h2 id="works-title">作品</h2>
          <span>以清透、安静的界面承载丰富的生活色彩。</span>
        </div>

        <div class="series-bar glass-panel" id="series" aria-label="作品系列筛选"></div>

        <div class="apple-grid" aria-live="polite"></div>
      </section>

      <section class="about-section glass-panel" id="about" aria-labelledby="about-title">
        <div>
          <p>About</p>
          <h2 id="about-title">一份持续更新的生活视觉档案</h2>
        </div>
        <p>
          这个版本保留图片的鲜明个性，但用浅色背景、柔和阴影、玻璃卡片和更安静的文字系统，让整体更接近 Apple 风格的高级个人主页。
        </p>
      </section>
    </main>

    <div class="apple-lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="作品大图预览" hidden>
      <button class="lightbox-close" type="button" aria-label="关闭预览">×</button>
      <figure class="lightbox-card">
        <img class="lightbox-image" src="" alt="" />
        <figcaption class="lightbox-caption"></figcaption>
        <div class="lightbox-controls" aria-label="作品切换">
          <button class="lightbox-nav previous" type="button" data-direction="previous" aria-label="上一张">上一张</button>
          <button class="lightbox-nav next" type="button" data-direction="next" aria-label="下一张">下一张</button>
        </div>
      </figure>
    </div>

    <script src="gallery-data.js?v=17"></script>
    <script src="apple-template.js?v=1"></script>
  </body>
</html>
